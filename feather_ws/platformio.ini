; Remote wireless kill-switch transmitter -- the Feather counterpart to
; arduino_ws's primary e-stop Nano. Reads a physical kill-switch input and
; reports status continuously over a UART LoRa transceiver module wired to
; Serial2, which the Nano's own paired module receives and hands to the
; Nano's Serial RX -- see arduino_ws/src/main.cpp for the receiving side
; and the shared H/X line protocol.
;
; Board confirmed 2026-09-26: a "YD-RP2040" Feather-form-factor board,
; identifies over USB as Adafruit's own Feather RP2040 (VID:PID
; 239A:80F1/80F2) -- this is a common clone pattern (reuses Adafruit's
; factory bootloader/USB identity rather than registering its own), and
; it's pin-compatible with the genuine board, so the `adafruit_feather`
; board definition (RP2040, earlephilhower Arduino core) is the correct
; target. Native USB CDC (Serial) is independent of the Serial2 hardware
; UART (UART1, GP8 TX / GP9 RX) used for the LoRa module here -- no
; upload/wiring conflict the way the Nano's single shared UART has. Note:
; this board variant's own pins_arduino.h does NOT pin out Serial2 by
; default (unlike the generic "pico" board) -- src/main.cpp's setup()
; explicitly remaps it to GP8/GP9 via setTX()/setRX() before .begin().
;
; Uses maxgerhardt's community fork of platform-raspberrypi because the
; official PlatformIO `raspberrypi` platform only ships Arduino-mbed
; boards (just `pico` / `nanorp2040connect` for RP2040) and has no Feather
; RP2040 board definition.
[env:adafruit_feather_rp2040]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = adafruit_feather
framework = arduino
monitor_speed = 115200
upload_protocol = picotool
