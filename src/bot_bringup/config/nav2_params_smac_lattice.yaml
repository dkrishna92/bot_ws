# ============================================================================
# A/B TEST VARIANT (SmacPlannerLattice planner): planner_server.GridBased swapped, everything
# else is an exact copy of nav2_params.yaml.
# See CLAUDE.md's "Nav2 planner/controller comparison" section for the
# full rationale and test protocol.
# Launch with:
#   ros2 launch bot_bringup bringup.launch.py use_sim:=true nav2_params_file:=nav2_params_smac_lattice.yaml
# ============================================================================
amcl:
  ros__parameters:
    use_sim_time: True
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    base_frame_id: "base_link"
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    global_frame_id: "map"
    # set_initial_pose defaults to false, and nothing ever publishes
    # /initialpose in a race run (no human to click "2D Pose Estimate" in
    # RViz during an autonomous, vision-triggered start) -- without it amcl
    # never seeds its particle filter or starts broadcasting map->odom, so
    # the "map" frame never comes into existence and every downstream
    # consumer (global costmap, planner) times out waiting for a transform
    # that will never appear. This looks like "the planner is broken" but
    # localization never started. x/y/yaw below match the fixed course-start
    # spawn pose used by both gazebo_sim.launch.py (-x -0.7 -y 0.0) and
    # mapping.launch.py, which is also where the saved map's origin is
    # anchored -- update these if the start box spawn pose ever changes.
    set_initial_pose: true
    initial_pose:
      x: -0.7
      y: 0.0
      z: 0.0
      yaw: 0.0
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_max_range: 100.0
    laser_min_range: 0.1
    laser_model_type: "likelihood_field"
    max_beams: 60
    max_particles: 2000
    min_particles: 500
    odom_frame_id: "odom"
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    # Fully-qualified pluginlib name required on this Nav2 (Jazzy) --
    # the short name "differential" from older Nav2 versions isn't a
    # registered plugin here and made amcl fail to configure ("class
    # differential ... does not exist"), which meant amcl never
    # published map->odom -- Nav2 had no localized pose to plan from,
    # so it looked like a planner problem even though the planner
    # itself was never the issue.
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    save_pose_rate: 0.5
    sigma_hit: 0.2
    sigma_short: 0.1
    tf_broadcast: true
    transform_tolerance: 1.0
    update_min_a: 0.2
    update_min_d: 0.25
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05

bt_navigator:
  ros__parameters:
    use_sim_time: True
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    # No plugin_lib_names / default_bt_xml_filename here -- those are the
    # deprecated pre-Iron config style. This Nav2 version auto-registers all
    # standard BT nodes itself; explicitly listing them too (as this file
    # used to) causes "ID [ComputePathToPose] already registered" and
    # crashes bt_navigator. The XML filename we had
    # ("navigate_w_replanning_and_recovery.xml") also didn't match any real
    # file -- the actual ones are navigate_to_pose_w_replanning_and_recovery.xml
    # and navigate_through_poses_w_replanning_and_recovery.xml, which are
    # exactly what these navigator plugins default to when left unset.
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"

controller_server:
  ros__parameters:
    use_sim_time: True
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    controller_plugins: ["FollowPath"]

    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: true
      max_vel_x: 0.5
      min_vel_x: 0.0
      max_vel_y: 0.0
      min_vel_y: 0.0
      max_vel_theta: 1.0
      min_speed_xy: 0.0
      max_speed_xy: 0.5
      min_speed_theta: 0.0
      max_speed_theta: 1.0
      acc_lim_x: 2.5
      acc_lim_y: 0.0
      acc_lim_theta: 3.2
      decel_lim_x: -2.5
      decel_lim_y: 0.0
      decel_lim_theta: -3.2
      vx_samples: 20
      vy_samples: 5
      vtheta_samples: 20
      sim_time: 1.7
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.2
      xy_goal_tolerance: 0.25
      trans_stopped_velocity: 0.25
      short_circuit_trajectory_evaluation: true
      stateful: true
      critics: ["RotateToGoal", "Oscillation", "BaseObstacle", "GoalAlign", "PathAlign"]
      BaseObstacle:
          # 0.3 overpowered PathAlign/GoalAlign in the tight corridor,
          # making the robot back away from obstacles ahead instead of
          # continuing to follow the path -- 0.1 is a middle ground.
          scale: 0.1
          max_scaling_factor: 0.1
          scoring_pose_frame: "base_link"
      GoalAlign:
          scale: 24.0
          forward_point_distance: 0.325
      PathAlign:
          scale: 32.0
          forward_point_distance: 0.325
      RotateToGoal:
          # Lowered from 32 -- tied with PathAlign, RotateToGoal was
          # dominating trajectory scoring and making the robot repeatedly
          # spin in place to face the path instead of driving forward
          # along it in tight corridors.
          scale: 8.0
          slowing_factor: 5.0
          lookahead_time: -1.0
      Oscillation:
          scale: 1.0
          # Requires more forward progress before a reversal trajectory is
          # allowed again -- default 0.05m let the robot flip-flop forward
          # and backward almost immediately.
          oscillation_reset_dist: 0.3

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: True
      update_frequency: 10.0
      publish_frequency: 10.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      # 0.26 is the true circumscribed-circle radius of the actual
      # measured chassis (17.7 x 10.6in / 0.45 x 0.27m,
      # sqrt((0.45/2)^2+(0.27/2)^2)), matching bot.urdf.xacro's real
      # base_link collision box and mass (7lb, well under the 25lb rule
      # cap). Do NOT shrink this below whatever bot.urdf.xacro's real
      # footprint currently is -- doing so let Nav2 plan through gaps the
      # simulated robot's actual collision geometry can't fit through,
      # causing real Gazebo collisions (chassis clipping bales) that
      # looked like a DWB tuning problem ("drives forward then gets
      # pushed back") but were actually physics. Keep this in sync if
      # base_width/base_length change again.
      robot_radius: 0.26
      plugins: ["obstacle_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.55
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        enabled: true
        map_subscribe_transient_local: true

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: True
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      # See local_costmap's robot_radius comment above -- same caveat applies.
      robot_radius: 0.26
      resolution: 0.05
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        enabled: true
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.55

planner_server:
  ros__parameters:
    use_sim_time: True
    expected_planner_frequency: 20.0
    planner_plugins: ["GridBased"]
    # SmacPlannerLattice, not NavFn/SmacPlannerHybrid -- "diff" motion model
    # matches this skid-steer robot (includes in-place-rotation primitives,
    # unlike ackermann; omni is wrong since this robot can't strafe). 0.5m
    # turning radius is the tighter of the two shipped options for this
    # ~1.3m corridor -- whether even that fits is exactly what this test is
    # meant to surface. There is no separate turning-radius YAML override
    # for this plugin -- it's parsed from lattice_filepath's own metadata
    # (confirmed via binary inspection); a custom radius would require the
    # upstream lattice-generator tool, which isn't installed on this
    # system. (minimum_turning_radius, a real param elsewhere, only applies
    # to SmacPlannerHybrid, not this plugin.)
    GridBased:
      plugin: "nav2_smac_planner::SmacPlannerLattice"
      lattice_filepath: "/opt/ros/jazzy/share/nav2_smac_planner/sample_primitives/5cm_resolution/0.5m_turning_radius/diff/output.json"
      allow_unknown: true
      # Matches NavFn baseline's tolerance -- planner-only comparison, not
      # also a tolerance comparison.
      tolerance: 0.25
      # Starting point carried over from this project's earlier (rejected)
      # SmacPlannerHybrid attempt, which hit "exceeded maximum iterations"
      # in this same tight corridor at a similar iteration budget. If this
      # plugin hits the same failure mode, raise this -- not a validated
      # value.
      max_iterations: 1000
      max_on_approach_iterations: 1000
      max_planning_time: 5.0
      # analytic_expansion_ratio / analytic_expansion_max_length below are
      # SearchInfo struct defaults from nav2_smac_planner's types.hpp, not
      # values from a shipped example config -- reasonable-but-unvalidated
      # starting points.
      analytic_expansion_ratio: 3.5
      analytic_expansion_max_length: 60.0
      reverse_penalty: 2.0
      change_penalty: 0.0
      non_straight_penalty: 1.05
      rotation_penalty: 5.0
      cost_penalty: 2.0
      retrospective_penalty: 0.015
      cache_obstacle_heuristic: false
      # False: recovery_server deliberately never registers back_up (no
      # rear-facing perception) -- letting the planner route through
      # reverse segments would plan paths this robot's sensors can't
      # actually validate at execution time.
      allow_reverse_expansion: false
      # False, not this plugin's own internal smoother: NavFn and Theta*
      # (the other two variants under test) don't have one, so disabling
      # this keeps smoothing behavior identical across all three --
      # smoother_server's SimpleSmoother runs downstream for all of them
      # either way.
      smooth_path: false

smoother_server:
  ros__parameters:
    use_sim_time: True
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      # 1e-10 (no decimal point) parses as a YAML string, not a float --
      # ROS 2's parameter loader then rejects it ("is of type double,
      # setting it to string is not allowed") and smoother_server fails
      # to configure, aborting the whole lifecycle bringup (so nothing,
      # including the planner, ever activates). 1.0e-10 parses as a float.
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true

recovery_server:
  ros__parameters:
    use_sim_time: True
    # back_up deliberately not registered -- no rear-facing perception
    # sensors on this robot, so blind reversing during recovery isn't safe.
    recovery_plugins: ["spin"]
    spin:
      plugin: "nav2_recoveries::Spin"
      simulate_ahead_time: 2.0
      max_rotations: 10.0
      max_effort: 100.0

map_server:
  ros__parameters:
    use_sim_time: True
    yaml_filename: ""

# This Nav2 version's navigation_launch.py brings up collision_monitor as a
# standard lifecycle node regardless of whether it's actually wired into the
# cmd_vel path -- with no config at all it fails "observation_sources is not
# initialized" during configure and aborts the whole lifecycle bringup
# (controller_server, bt_navigator, everything). Config below is copied
# as-is from nav2_bringup's own reference params. It's currently a no-op:
# nothing publishes cmd_vel_in_topic, so collision_monitor never fires and
# controller_server's direct FollowPath -> cmd_vel publish is unaffected.
# To actually use it as a safety layer, add a velocity_smoother publishing
# cmd_vel_smoothed and point controller_server's output there instead of
# straight to cmd_vel.
collision_monitor:
  ros__parameters:
    use_sim_time: True
    base_frame_id: "base_link"
    odom_frame_id: "odom"
    cmd_vel_in_topic: "cmd_vel_smoothed"
    cmd_vel_out_topic: "cmd_vel"
    state_topic: "collision_monitor_state"
    transform_tolerance: 0.2
    source_timeout: 1.0
    base_shift_correction: True
    stop_pub_timeout: 2.0
    # An empty list here fails ROS 2 parameter type inference at startup
    # ("polygons: No parameter value set") -- an empty array has no
    # elements to infer element-type from. Use nav2_bringup's actual
    # default polygon instead of trying to invent an empty/disabled one.
    polygons: ["FootprintApproach"]
    FootprintApproach:
      type: "polygon"
      action_type: "approach"
      footprint_topic: "/local_costmap/published_footprint"
      time_before_collision: 1.2
      simulation_time_step: 0.1
      min_points: 6
      visualize: False
      enabled: True
    observation_sources: ["scan"]
    scan:
      type: "scan"
      topic: "scan"
      min_height: 0.15
      max_height: 2.0
      enabled: True

# Another node navigation_launch.py brings up unconditionally (see the
# collision_monitor comment above for the pattern) -- this project has no
# charging dock, so dock_plugins is never actually invoked (nothing calls
# the dock_robot/undock_robot actions), but the list can't be left empty
# for the same array-type-inference reason as collision_monitor's polygons.
docking_server:
  ros__parameters:
    use_sim_time: True
    base_frame: "base_link"
    fixed_frame: "odom"
    dock_plugins: ["simple_charging_dock"]
    simple_charging_dock:
      plugin: "opennav_docking::SimpleChargingDock"
