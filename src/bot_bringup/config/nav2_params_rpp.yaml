# ============================================================================
# VARIANT (Rotation Shim + Regulated Pure Pursuit controller):
# controller_server.FollowPath swapped, everything else is an exact copy of
# nav2_params.yaml (generated from it 2026-10-01). Much lighter than MPPI -- a
# geometric path follower, suited to following a recorded route on the
# speed course. See CLAUDE.md's "Nav2 planner/controller comparison".
# Launch with:
#   ros2 launch bot_bringup bringup.launch.py nav2_params_file:=nav2_params_rpp.yaml
# ============================================================================
amcl:
  ros__parameters:
    use_sim_time: True
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    base_frame_id: "base_link"
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    global_frame_id: "map"
    # set_initial_pose defaults to false, and nothing ever publishes
    # /initialpose in a race run (no human to click "2D Pose Estimate" in
    # RViz during an autonomous, vision-triggered start) -- without it amcl
    # never seeds its particle filter or starts broadcasting map->odom, so
    # the "map" frame never comes into existence and every downstream
    # consumer (global costmap, planner) times out waiting for a transform
    # that will never appear. This looks like "the planner is broken" but
    # localization never started. x/y/yaw below match speed_course_cfr's
    # spawn pose (gazebo_sim.launch.py's _DEFAULT_SPAWN_POSES, now the
    # default world) -- update these if the default world or its spawn
    # pose ever changes again, and regenerate config/maps/map.yaml via
    # mapping.launch.py against that same world so the saved map actually
    # covers this pose (a map built for a different world/spawn won't).
    #
    # x nudged 19.0 -> 18.5, 2026-09-27 (TEMPORARY workaround, see
    # CLAUDE.md's "AMCL's initial pose is a hardcoded constant" open item):
    # the currently-committed map.yaml's saved bounds only extend to
    # x=18.839 (a map from an incomplete/undersized mapping run, not a
    # world/spawn change), so the true spawn pose (19.0) seeds AMCL just
    # outside the map -- "robot out of bounds" in Nav2/RViz despite
    # Gazebo's ground-truth spawn being correct. 18.5 sits safely inside
    # with margin, at the cost of a small (0.5m) known lie about the real
    # spawn x. Revert to 19.0 once the map is regenerated to actually
    # cover the real spawn point.
    set_initial_pose: true
    initial_pose:
      x: -0.7
      y: 0.0
      z: 0.0
      yaw: 0.0
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_max_range: 100.0
    laser_min_range: 0.1
    laser_model_type: "likelihood_field"
    max_beams: 60
    max_particles: 2000
    min_particles: 500
    odom_frame_id: "odom"
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    # Fully-qualified pluginlib name required on this Nav2 (Jazzy) --
    # the short name "differential" from older Nav2 versions isn't a
    # registered plugin here and made amcl fail to configure ("class
    # differential ... does not exist"), which meant amcl never
    # published map->odom -- Nav2 had no localized pose to plan from,
    # so it looked like a planner problem even though the planner
    # itself was never the issue.
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    save_pose_rate: 0.5
    sigma_hit: 0.2
    sigma_short: 0.1
    tf_broadcast: true
    transform_tolerance: 1.0
    update_min_a: 0.2
    update_min_d: 0.25
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05

bt_navigator:
  ros__parameters:
    use_sim_time: True
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    # No plugin_lib_names / default_bt_xml_filename here -- those are the
    # deprecated pre-Iron config style. This Nav2 version auto-registers all
    # standard BT nodes itself; explicitly listing them too (as this file
    # used to) causes "ID [ComputePathToPose] already registered" and
    # crashes bt_navigator. The XML filename we had
    # ("navigate_w_replanning_and_recovery.xml") also didn't match any real
    # file -- the actual ones are navigate_to_pose_w_replanning_and_recovery.xml
    # and navigate_through_poses_w_replanning_and_recovery.xml, which are
    # exactly what these navigator plugins default to when left unset.
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"

controller_server:
  ros__parameters:
    use_sim_time: True
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    controller_plugins: ["FollowPath"]

    FollowPath:
      # Rotation Shim: turn in place toward the path first when it's more
      # than angular_dist_threshold off the robot's heading, then hand over
      # to Regulated Pure Pursuit. Both read their parameters from here.
      plugin: "nav2_rotation_shim_controller::RotationShimController"
      primary_controller: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      angular_dist_threshold: 0.785
      forward_sampling_distance: 0.5
      rotate_to_heading_angular_vel: 1.5
      max_angular_accel: 3.2
      simulate_ahead_time: 1.0
      rotate_to_goal_heading: false
      # Regulated Pure Pursuit: steer toward a point lookahead_dist ahead on
      # the path. Geometric -- no trajectory sampling, so far lighter than
      # DWB or MPPI. Doesn't swerve around obstacles itself: it slows, and
      # stops if a collision is ahead within max_allowed_time_to_collision;
      # the planner re-plans around them on the costmap.
      desired_linear_vel: 1.5
      lookahead_dist: 0.8
      min_lookahead_dist: 0.5
      max_lookahead_dist: 1.5
      lookahead_time: 0.8
      use_velocity_scaled_lookahead_dist: true
      transform_tolerance: 0.2
      min_approach_linear_velocity: 0.3
      approach_velocity_scaling_dist: 0.6
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: false
      regulated_linear_scaling_min_radius: 0.9
      regulated_linear_scaling_min_speed: 0.25
      use_fixed_curvature_lookahead: false
      allow_reversing: false
      use_rotate_to_heading: false  # the shim does the initial turn
      max_robot_pose_search_dist: 10.0
      # Note: motor_node's duty floors make ~1.1 m/s the slowest straight
      # speed, so the slow-downs above (curves, approach) are partly lost
      # on the real robot.

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: True
      update_frequency: 10.0
      publish_frequency: 10.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      # Real footprint as a polygon, not a circle (changed 2026-10-01): the
      # robot is ~0.45 m long x 0.39 m wide over the wheels (bot.urdf.xacro:
      # base_length 0.445, track 0.33 + 0.06 wheel width). The old
      # robot_radius 0.26 circle overstated each SIDE by 7 cm (half-width
      # 0.195) and understated the corners (0.29): in the sim rehearsal the
      # global planner refused ("Failed to create plan") a hay-bale lane the
      # robot had just driven through by teleop. With a polygon the planner
      # only blocks cells within the true half-width, and DWB/MPPI and the
      # collision monitor check the exact rectangle -- so this does not let
      # Nav2 plan through gaps the real chassis can't fit (the caveat that
      # used to be here). Keep in sync if the chassis/wheels change.
      footprint: "[[0.225, 0.195], [0.225, -0.195], [-0.225, -0.195], [-0.225, 0.195]]"
      footprint_padding: 0.02
      plugins: ["obstacle_layer", "voxel_layer", "range_sensor_layer", "inflation_layer"]
      # Two side-facing HC-SR04 ultrasonics (bot_odometry publishes
      # sensor_msgs/Range on /ultrasonic/left|right) for close-range side
      # coverage the forward-facing lidar/depth layers miss. Marking only:
      # a no-echo reading is published as range>max_range, which this layer
      # ignores (no false obstacle at max distance), and stale marks scroll
      # out of the rolling local costmap. Needs the ultrasonic_left/right TF
      # frames added in bot.urdf.xacro.
      range_sensor_layer:
        plugin: "nav2_costmap_2d::RangeSensorLayer"
        enabled: true
        topics: ["/ultrasonic/left", "/ultrasonic/right"]
        input_sensor_type: "ALL"
        clear_on_max_reading: false
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        # 0.55 left the slalom lane between adjacent bale rows at nonzero
        # cost across its full width: rows are ~1.4m apart (0.94m clear
        # gap, from speed_course_cfr.world's bale_57-64/194-199 poses),
        # so a 0.55 radius from each side overlaps past the centerline.
        # 0.35 matches nav2_mapping_params.yaml's already-validated value.
        inflation_radius: 0.35
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
      # RPLIDAR (obstacle_layer above) stays the 2D layer for the global map
      # match / SLAM side of things -- clean, long-range, unaffected by
      # lighting. This voxel_layer is the OAK-D S2's depth feed instead: it
      # catches the 3D/low-lying hazards a planar LiDAR sweep can miss (a
      # table edge below the LiDAR's scan plane, a stray object, a
      # step/cliff), letting the local controller path around them in real
      # time while the LiDAR-built map still anchors global bearings. Source
      # topic (/oak/points) comes from bringup.launch.py's depth_image_proc
      # PointCloudXyzNode on real hardware -- see that launch file's comment
      # for why. In Gazebo, the same topic is published instead by
      # bot.urdf.xacro's oak_depth_sensor (gz-sim depth_camera), bridged in
      # gazebo_sim.launch.py -- see that sensor's comment.
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: true
        publish_voxel_map: true
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        max_obstacle_height: 1.0
        mark_threshold: 0
        observation_sources: oak_points
        oak_points:
          topic: /oak/points
          data_type: "PointCloud2"
          # 0.06, not 0.02 (2026-10-01): the course is asphalt with loose hay
          # on it, and the OAK sits ~10 cm up -- at 2 cm, hay, bumps and
          # stereo-depth noise a few metres out would all mark phantom
          # obstacles. Bales (35 cm+) are still seen; the lidar (~15 cm) is
          # unaffected. Potholes are invisible either way (below ground).
          min_obstacle_height: 0.06
          max_obstacle_height: 1.0
          obstacle_max_range: 3.0
          clearing: true
          marking: true
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        enabled: true
        map_subscribe_transient_local: true

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: True
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      # Same polygon footprint as local_costmap (see its comment).
      footprint: "[[0.225, 0.195], [0.225, -0.195], [-0.225, -0.195], [-0.225, 0.195]]"
      footprint_padding: 0.02
      resolution: 0.05
      plugins: ["static_layer", "obstacle_layer", "voxel_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        enabled: true
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
      # Same OAK-D depth feed as local_costmap's voxel_layer above -- see
      # that block's comment for the full rationale (3D/low-lying hazards
      # a planar lidar sweep misses). Global planning previously only saw
      # the lidar-built static map + live lidar scan, so a route could be
      # planned straight through something only the depth camera sees.
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: true
        publish_voxel_map: true
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        max_obstacle_height: 1.0
        mark_threshold: 0
        observation_sources: oak_points
        oak_points:
          topic: /oak/points
          data_type: "PointCloud2"
          # 0.06, not 0.02 (2026-10-01): the course is asphalt with loose hay
          # on it, and the OAK sits ~10 cm up -- at 2 cm, hay, bumps and
          # stereo-depth noise a few metres out would all mark phantom
          # obstacles. Bales (35 cm+) are still seen; the lidar (~15 cm) is
          # unaffected. Potholes are invisible either way (below ground).
          min_obstacle_height: 0.06
          max_obstacle_height: 1.0
          obstacle_max_range: 3.0
          clearing: true
          marking: true
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        # See local_costmap's inflation_radius comment above -- same
        # bale-row-spacing rationale applies here.
        inflation_radius: 0.35

planner_server:
  ros__parameters:
    use_sim_time: True
    expected_planner_frequency: 20.0
    planner_plugins: ["GridBased"]
    # NavFn, not SmacPlannerHybrid -- this robot is skid-steer diff-drive
    # (can rotate in place), so it doesn't need Reeds-Shepp's non-holonomic
    # minimum-turning-radius constraints, which were causing "exceeded
    # maximum iterations" in the tight corridor near the course start.
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.25
      use_astar: true
      allow_unknown: true

smoother_server:
  ros__parameters:
    use_sim_time: True
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      # 1e-10 (no decimal point) parses as a YAML string, not a float --
      # ROS 2's parameter loader then rejects it ("is of type double,
      # setting it to string is not allowed") and smoother_server fails
      # to configure, aborting the whole lifecycle bringup (so nothing,
      # including the planner, ever activates). 1.0e-10 parses as a float.
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true

behavior_server:
  ros__parameters:
    use_sim_time: True
    local_costmap_topic: local_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_costmap_topic: global_costmap/costmap_raw
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    # Jazzy: the node is behavior_server with behavior_plugins and the
    # nav2_behaviors:: namespace. The old recovery_server / recovery_plugins
    # / nav2_recoveries:: names are silently IGNORED here, which had let
    # behavior_server fall back to its full default plugin set at runtime.
    # backup/drive_on_heading ARE registered: the 360-degree 2D RPLIDAR
    # covers the rear in its scan plane and fills the local costmap behind
    # the robot, so BackUp's collision check has data to act on (it only
    # sees the lidar plane -- low rear obstacles below it stay unseen).
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"
    local_frame: odom
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 0.1
    simulate_ahead_time: 2.0
    max_rotational_vel: 3.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2

map_server:
  ros__parameters:
    use_sim_time: True
    yaml_filename: ""

# This Nav2 version's navigation_launch.py brings up collision_monitor as a
# standard lifecycle node regardless of whether it's actually wired into the
# cmd_vel path -- with no config at all it fails "observation_sources is not
# initialized" during configure and aborts the whole lifecycle bringup
# (controller_server, bt_navigator, everything). Config below is copied
# as-is from nav2_bringup's own reference params. It's currently a no-op:
# nothing publishes cmd_vel_in_topic, so collision_monitor never fires and
# controller_server's direct FollowPath -> cmd_vel publish is unaffected.
# To actually use it as a safety layer, add a velocity_smoother publishing
# cmd_vel_smoothed and point controller_server's output there instead of
# straight to cmd_vel.
collision_monitor:
  ros__parameters:
    use_sim_time: True
    base_frame_id: "base_link"
    odom_frame_id: "odom"
    cmd_vel_in_topic: "cmd_vel_smoothed"
    cmd_vel_out_topic: "cmd_vel"
    state_topic: "collision_monitor_state"
    transform_tolerance: 0.2
    source_timeout: 1.0
    base_shift_correction: True
    stop_pub_timeout: 2.0
    # An empty list here fails ROS 2 parameter type inference at startup
    # ("polygons: No parameter value set") -- an empty array has no
    # elements to infer element-type from. Use nav2_bringup's actual
    # default polygon instead of trying to invent an empty/disabled one.
    polygons: ["FootprintApproach"]
    FootprintApproach:
      type: "polygon"
      action_type: "approach"
      footprint_topic: "/local_costmap/published_footprint"
      time_before_collision: 1.2
      simulation_time_step: 0.1
      min_points: 6
      visualize: False
      enabled: True
    observation_sources: ["scan"]
    scan:
      type: "scan"
      topic: "scan"
      min_height: 0.15
      max_height: 2.0
      enabled: True

# Another node navigation_launch.py brings up unconditionally (see the
# collision_monitor comment above for the pattern) -- this project has no
# charging dock, so dock_plugins is never actually invoked (nothing calls
# the dock_robot/undock_robot actions), but the list can't be left empty
# for the same array-type-inference reason as collision_monitor's polygons.
docking_server:
  ros__parameters:
    use_sim_time: True
    base_frame: "base_link"
    fixed_frame: "odom"
    dock_plugins: ["simple_charging_dock"]
    simple_charging_dock:
      plugin: "opennav_docking::SimpleChargingDock"

# Must be set explicitly: velocity_smoother sits between the controller and
# /cmd_vel, and with no section here Nav2's built-in default caps linear
# speed at 0.5 m/s regardless of the controller's limits. Reference-config
# values except max/min_velocity, which match this file's controller caps.
velocity_smoother:
  ros__parameters:
    use_sim_time: True
    smoothing_frequency: 20.0
    scale_velocities: False
    feedback: "OPEN_LOOP"
    max_velocity: [1.5, 0.0, 3.0]
    min_velocity: [-0.5, 0.0, -3.0]
    max_accel: [2.5, 0.0, 3.2]
    max_decel: [-2.5, 0.0, -3.2]
    odom_topic: "odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0
