# Loaded by hardware.launch.py for sllidar_ros2's sllidar_node (the apt
# rplidar_ros driver can't talk to this lidar -- see hardware.launch.py).
# serial_port is overridden there from the lidar_port launch arg.
# Unit is an RPLIDAR S2: 1 Mbaud, DenseBoost = 32 kHz / 10 Hz / 30 m.
sllidar_node:
  ros__parameters:
    serial_port: /dev/rplidar
    serial_baudrate: 1000000
    frame_id: lidar_link
    inverted: false
    angle_compensate: true
    scan_mode: DenseBoost
