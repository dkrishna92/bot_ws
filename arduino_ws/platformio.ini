; Primary wireless e-stop firmware for the CFR robot's Arduino Nano.
;
; This board is electrically isolated from the Pi/ROS 2 stack -- its
; serial RX is wired directly to a UART LoRa transceiver module, not the
; Pi. It is the hard real-time e-stop layer from CLAUDE.md's Safety
; architecture (motor cutoff within 1s of wireless signal loss), separate
; from bot_safety's ROS 2 watchdog, which is defense-in-depth only. Its
; relay breaks the motor driver's power supply directly, not a
; logic-level enable/disable line. See src/main.cpp for the serial
; protocol and fail-safe relay logic, and feather_ws for the remote
; kill-switch transmitter on the other end of the LoRa link.
;
; Board/upload settings are for the Arduino Nano ESP32 (ESP32-S3, native
; USB CDC) -- 2026-09-25, replaced an earlier classic-Nano/atmelavr target.
; NOTE: on this board `Serial` is the USB-CDC console, NOT a GPIO UART --
; the LoRa module's UART link uses a dedicated `LoraSerial` HardwareSerial
; instance on LORA_RX_PIN/LORA_TX_PIN instead (see src/main.cpp). BLE
; (this board's onboard Bluetooth) was tried for debug-only board
; identification and removed 2026-09-26 as the prime suspect for an
; intermittent boot hang -- the e-stop link stays wired UART LoRa only,
; per CLAUDE.md's Safety architecture.
; RELAY_PIN, LORA_RX_PIN/LORA_TX_PIN, M0/M1, and the LoRa module's UART
; baud rate are all confirmed against real hardware and tested working as
; of 2026-09-26 -- see src/main.cpp and CLAUDE.md's "E-stop wireless
; link: real-hardware bring-up and sequencing" entry for details.
[env:arduino_nano_esp32]
platform = espressif32
board = arduino_nano_esp32
framework = arduino
monitor_speed = 115200
