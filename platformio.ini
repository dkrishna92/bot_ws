; Wheel encoder + ultrasonic reporting firmware for the CFR robot's Teensy.
;
; Reads two quadrature encoders (left side, right side -- matches the
; skid-steer drivetrain's per-side grouping in bot_gazebo's DiffDrive
; plugin config) and three HC-SR04-class ultrasonic sensors, and reports
; both to the Raspberry Pi over one USB serial link as one text line per
; sample:
;
;     E,<left_ticks>,<right_ticks>,<micros>\n        (~50Hz)
;     U,<front_left_us>,<front_right_us>,<rear_us>,<micros>\n  (~20Hz)
;
; Ultrasonic sensing moved here from the Pi (2026-09-20) -- it was
; previously a bit-banged RPi.GPIO node (bot_ultrasonic), which CLAUDE.md
; already flagged as a timing-noise risk worth moving off the Pi. This
; board exposes a single virtual COM port (not a dual-serial USB config),
; so bot_odometry's wheel_odom_node is the sole owner of this link and
; parses both line types; there is no separate ROS node for ultrasonic
; anymore.
;
; E-stop is a separate Arduino Nano driving a relay that breaks the motor
; driver's power supply directly -- not this board, and not represented
; here (see CLAUDE.md's Safety architecture, and arduino_ws).
;
; Board and pin assignment are placeholders until hardware is in hand --
; same "confirm before locking" status as the project's RPLIDAR baudrate.
; Change board= and the pin #defines in src/main.cpp once encoders/
; ultrasonic sensors are wired up.
[env:teensy40]
platform = teensy
board = teensy40
framework = arduino
lib_deps =
    paulstoffregen/Encoder@^1.4.4
monitor_speed = 115200
